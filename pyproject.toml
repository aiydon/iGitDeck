[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "igitdeck"
version = "0.1.0"
description = "Internal Git repository mirror and code insight dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bleach>=6.2",
    "fastapi>=0.115",
    "markdown-it-py>=3.0",
    "parsel>=1.10",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "tqdm>=4.67",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
igitdeck = "igitdeck.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/igitdeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["igitdeck"]
